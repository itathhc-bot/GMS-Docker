# Note: In Kubernetes, we replace the custom NGINX proxy container with an Ingress Controller.
# This assumes an NGINX Ingress Controller is installed in your cluster.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garage-guardian-ingress
  namespace: garage-guardian
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    # Cert-manager for Let's Encrypt TLS
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - techaura-projects.com
    secretName: garage-guardian-tls
  rules:
  - host: techaura-projects.com
    http:
      paths:
      # Reverb WebSocket
      - path: /app
        pathType: Prefix
        backend:
          service:
            name: reverb
            port:
              number: 8080
      # Laravel API
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 9000
      - path: /sanctum
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 9000
      - path: /broadcasting
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 9000
      # MinIO Storage (presigned URLs)
      - path: /storage
        pathType: Prefix
        backend:
          service:
            name: minio
            port:
              number: 9000
      # Frontend SPA
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
