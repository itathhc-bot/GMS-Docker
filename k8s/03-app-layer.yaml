---
# BACKEND (PHP-FPM)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: garage-guardian
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: registry.example.com/garage-guardian/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9000
        envFrom:
        - configMapRef:
            name: garage-config
        - secretRef:
            name: garage-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: garage-guardian
spec:
  ports:
  - port: 9000
  selector:
    app: backend
---
# FRONTEND (NGINX SPA)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: garage-guardian
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: registry.example.com/garage-guardian/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: garage-guardian
spec:
  ports:
  - port: 8080
  selector:
    app: frontend
---
