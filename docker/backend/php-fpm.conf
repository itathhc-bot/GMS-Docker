; docker/backend/php-fpm.conf
; PHP-FPM pool configuration for production

[www]
user = appuser
group = appgroup

; Listen on TCP socket (easier for Docker networking)
listen = 0.0.0.0:9000
listen.owner = appuser
listen.group = appgroup

; Process management — dynamic for best balance
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 35
pm.max_requests = 500

; Log slow requests
request_slowlog_timeout = 10s
slowlog = /dev/stderr

; Send FPM logs to stderr so Docker captures them
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on

; Status endpoint (for health checks by NGINX)
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong
