# ───────────────────────────────────────────────────────────────────────────
# Upstream services
# ───────────────────────────────────────────────────────────────────────────
upstream backend_fpm {
    server backend:9000;
    keepalive 32;
}

upstream frontend_static {
    # Port changed to 8080 for OpenShift nginx-unprivileged compatibility
    server frontend:8080;
}

upstream reverb_ws {
    server reverb:8080;
}

# ───────────────────────────────────────────────────────────────────────────
# Main server block
# ───────────────────────────────────────────────────────────────────────────
server {
    # Run on 8080 for OpenShift
    listen 8080;
    server_name techaura-projects.com www.techaura-projects.com localhost _;

    root /var/www/html/public;
    index index.php;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Health check ──────────────────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Laravel Reverb WebSocket ──────────────────────────────────────────
    location /app/ {
        proxy_pass http://reverb_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── API routes → PHP-FPM backend ─────────────────────────────────────
    location ~ ^/(api|sanctum|horizon|telescope|broadcasting|fpm-status|fpm-ping)(/|$) {
        limit_req zone=api burst=60 nodelay;
        limit_conn conn_limit 20;

        try_files $uri /index.php$is_args$args;
    }

    # ── Auth rate limiting ────────────────────────────────────────────────
    location ~ ^/api/auth/(login|forgot-password) {
        limit_req zone=auth burst=5 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    # ── PHP-FPM processing ────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass backend_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 60;
        fastcgi_send_timeout 60;
    }

    # ── Static assets (built by Vite) → frontend container ───────────────
    location /build/ {
        proxy_pass http://frontend_static/build/;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── All other routes → frontend SPA ──────────────────────────────────
    location / {
        proxy_pass http://frontend_static;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SPA fallback handled inside frontend container
        proxy_intercept_errors off;
    }

    # ── Block sensitive files ─────────────────────────────────────────────
    location ~ /\.(env|git|htaccess|DS_Store) {
        deny all;
        return 404;
    }

    location ~ \.(sh|sql|log|ini|conf)$ {
        deny all;
        return 404;
    }

    # ── Favicon / robots ─────────────────────────────────────────────────
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
