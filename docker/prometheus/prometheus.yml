global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:9000'] # Or the specific port you expose metrics on

  - job_name: 'mariadb'
    static_configs:
      - targets: ['mariadb-exporter:9104'] # Assuming you add an exporter

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121'] # Assuming you add an exporter
